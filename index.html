<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globo - VIU Agenciamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!--
    O body veste o PLANO, não a folha — 12/08/2026.

    Ele vestia o cinza-claro da área de trabalho, e isso era invisível até a primeira vez em que
    algo de fora forçou a página a rolar (extensão de navegador injetando altura, overscroll,
    arredondamento de zoom): o que aparecia atrás do shell escuro era um vão claro — "um vazado de
    branco", nas palavras da operação.

    O app em navegador limpo ocupa exatamente a viewport (verificado em headless: body com um
    filho, sem scroll). O tom escuro aqui é blindagem para o que o app não controla: se alguém
    forçar um scroll, o que aparece é o plano — a tela continua inteira.

    `overscroll-none` completa: o elástico do trackpad também não descola o app da moldura.
  -->
  <body class="bg-plano overscroll-none text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
