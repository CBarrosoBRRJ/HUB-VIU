<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="VIU">
  <!--
    PLACEHOLDER da marca VIU — substituível sem tocar em código.

    A sidebar carrega este arquivo por caminho (`/logo-viu.svg`), não por import: trocar a arte
    oficial é sobrescrever o arquivo, e nada mais. Aceita .svg ou .png com o mesmo nome — se for
    .png, basta ajustar a extensão no `src` da sidebar.

    Limitação conhecida: SVG carregado por <img> vive num documento isolado e NÃO enxerga as fontes
    da página, então o texto aqui cai na sans do sistema em vez da tipografia da marca. É mais um
    motivo para trocar pelo arquivo oficial.
  -->
  <rect width="64" height="64" rx="15" fill="#2A00FF"/>
  <text
    x="29" y="42"
    font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"
    letter-spacing="-1" text-anchor="middle" fill="#F2FF00"
  >ViU</text>
  <circle cx="53" cy="22" r="4.5" fill="none" stroke="#F2FF00" stroke-width="2.6"/>
</svg>
